name: Build Deno

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos
        run: deno task check

      - name: Executar programa
        run: deno task run

      - name: Compilar para binário
        run: deno task compile

      - name: Enviar artefato
        uses: actions/upload-artifact@v7
        with:
          name: hello-deno-linux
          path: dist/hello-deno
