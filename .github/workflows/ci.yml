name: Build Deno

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos
        run: deno task check

      - name: Compilar 3 variantes isoladas
        run: deno task compile

      - name: Testar isolamento de permissões
        run: bash test.sh dist

      - name: Enviar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: deno-perm-bins
          path: |
            dist/no-fs
            dist/no-net
            dist/locked
            test.sh
